<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spartan Lounge - GLB Export</title>
    <link rel="icon" type="image/x-icon" href="/SpartanLoungeLogo.ico">
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;600;700&family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            color: #fff;
            font-family: 'Overpass', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .launcher {
            background: rgba(20, 25, 35, 0.95);
            border: 2px solid rgba(168, 212, 255, 0.3);
            border-radius: 16px;
            padding: 40px 50px;
            text-align: center;
            max-width: 520px;
            width: 90%;
        }
        .launcher h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 6px;
            color: #fff;
        }
        .launcher .subtitle {
            color: rgba(168, 212, 255, 0.6);
            font-size: 0.85rem;
            margin-bottom: 30px;
        }
        .map-select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(10, 12, 20, 0.8);
            border: 1px solid rgba(168, 212, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-family: 'Overpass', sans-serif;
            font-size: 1rem;
            margin-bottom: 20px;
            appearance: none;
            cursor: pointer;
        }
        .map-select:focus { outline: none; border-color: #00aaff; }
        .map-select option { background: #141923; }

        .export-btn {
            background: rgba(0, 170, 255, 0.15);
            border: 1px solid #00aaff;
            color: #00aaff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            padding: 14px 40px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
            width: 100%;
        }
        .export-btn:hover:not(:disabled) {
            background: rgba(0, 170, 255, 0.3);
            color: #fff;
        }
        .export-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(168, 212, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar {
            height: 100%;
            background: #00aaff;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: rgba(168, 212, 255, 0.7);
        }

        .status-log {
            display: none;
            margin-top: 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: rgba(168, 212, 255, 0.6);
            line-height: 1.6;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: rgba(168, 212, 255, 0.5);
            font-size: 0.85rem;
            text-decoration: none;
        }
        .back-link:hover { color: rgba(168, 212, 255, 0.8); }

        .logo { width: 48px; height: 48px; margin-bottom: 12px; }

        .options-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-group {
            flex: 1;
            text-align: left;
        }
        .option-group label {
            display: block;
            font-size: 0.75rem;
            color: rgba(168, 212, 255, 0.5);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .option-group select {
            width: 100%;
            padding: 8px 10px;
            background: rgba(10, 12, 20, 0.8);
            border: 1px solid rgba(168, 212, 255, 0.2);
            border-radius: 6px;
            color: #fff;
            font-size: 0.85rem;
        }
        .option-group select:focus { outline: none; border-color: #00aaff; }
        .option-group select option { background: #141923; }
    </style>
</head>
<body>
    <div class="launcher">
        <img src="/SpartanLoungeSquare.png" alt="SpartanLounge" class="logo">
        <h1>GLB MAP EXPORT</h1>
        <p class="subtitle">Export Halo 2 maps to GLB format for use in Blender, Unity, etc.</p>

        <select class="map-select" id="mapSelect">
            <option value="" disabled selected>Select Map...</option>
            <option value="Midship">Midship</option>
            <option value="Lockout">Lockout</option>
            <option value="Warlock">Warlock</option>
            <option value="Sanctuary">Sanctuary</option>
            <option value="Beaver Creek">Beaver Creek</option>
            <option value="Ascension">Ascension</option>
            <option value="Coagulation">Coagulation</option>
            <option value="Zanzibar">Zanzibar</option>
            <option value="Burial Mounds">Burial Mounds</option>
            <option value="Colossus">Colossus</option>
            <option value="Headlong">Headlong</option>
            <option value="Waterworks">Waterworks</option>
            <option value="Foundation">Foundation</option>
            <option value="Backwash">Backwash</option>
            <option value="Containment">Containment</option>
            <option value="Elongation">Elongation</option>
            <option value="Gemini">Gemini</option>
            <option value="Turf">Turf</option>
            <option value="Desolation">Desolation</option>
            <option value="Relic">Relic</option>
            <option value="Terminal">Terminal</option>
            <option value="Ivory Tower">Ivory Tower</option>
        </select>

        <button class="export-btn" id="exportBtn" disabled>EXPORT GLB</button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-bg">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">Preparing...</div>
        </div>

        <div class="status-log" id="statusLog"></div>

        <a href="/index.html" class="back-link">&larr; Back to Stats</a>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="./glb-exporter.js"></script>
</body>
</html>
